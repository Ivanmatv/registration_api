<!DOCTYPE html>
<html>
<head>
    <title>Подтверждение кода</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Введите код подтверждения</h3>
                    </div>
                    <div class="card-body">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                        
                        <p>Код отправлен на номер <strong>{{ request.session.auth_phone }}</strong></p>
                        <p>Код <strong>{{ request.session.auth_code }}</strong></p>
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="code" class="form-label">4-значный код</label>
                                <input type="text" class="form-control" id="code" name="code" 
                                       maxlength="4" pattern="\d{4}" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Подтвердить</button>
                        </form>
                        
                        <div class="mt-3 text-center">
                            <a href="{% url 'phone_auth' %}">Изменить номер</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
